<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角洲子弹监控 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;font-size:14px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a5f,#2c5282);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:#fff;padding:40px;border-radius:12px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{font-size:20px;margin-bottom:6px;color:#1e3a5f}
.login-box p{color:#8a9099;margin-bottom:24px;font-size:13px}
.login-box input{width:100%;padding:11px 12px;margin-bottom:14px;border:1px solid #d9dde3;border-radius:6px;font-size:14px;outline:none}
.login-box input:focus{border-color:#2c5282}
.login-box button{width:100%;padding:11px;background:#2c5282;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer}
.login-box button:hover{background:#1e3a5f}
.err{color:#c53030;font-size:13px;margin-top:10px;min-height:18px}
.layout{display:flex;min-height:100vh}
.sidebar{width:200px;background:#1e2a38;color:#c9d1d9;padding:20px 0;position:fixed;height:100vh;overflow-y:auto}
.sidebar h2{font-size:15px;padding:0 20px 18px;color:#fff;border-bottom:1px solid #2d3748;margin-bottom:12px}
.sidebar a{display:block;padding:11px 20px;color:#c9d1d9;text-decoration:none;font-size:14px;cursor:pointer}
.sidebar a:hover{background:#2d3748;color:#fff}
.sidebar a.active{background:#2c5282;color:#fff;border-left:3px solid #63b3ed}
.main{margin-left:200px;flex:1;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h1{font-size:20px}
.topbar .right{color:#8a9099;font-size:13px}
.topbar .right button{margin-left:10px;padding:6px 14px;border:1px solid #d9dde3;background:#fff;border-radius:5px;cursor:pointer;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.card{background:#fff;padding:18px;border-radius:8px;border:1px solid #e5e8ec}
.card .label{color:#8a9099;font-size:12px;margin-bottom:8px}
.card .value{font-size:24px;font-weight:600;color:#1e3a5f}
.card .sub{font-size:12px;color:#8a9099;margin-top:4px}
.card.warn .value{color:#c05621}
.card.danger .value{color:#c53030}
.card.ok .value{color:#276749}
.panel{background:#fff;border-radius:8px;border:1px solid #e5e8ec;padding:20px;margin-bottom:20px}
.panel h3{font-size:15px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.panel h3 .act{font-size:13px;font-weight:400}
.btn{padding:7px 14px;border:1px solid #d9dde3;background:#fff;border-radius:5px;cursor:pointer;font-size:13px;margin-right:8px}
.btn:hover{border-color:#2c5282;color:#2c5282}
.btn.primary{background:#2c5282;color:#fff;border-color:#2c5282}
.btn.primary:hover{background:#1e3a5f;color:#fff}
.btn.danger{color:#c53030}
.btn.danger:hover{border-color:#c53030}
.btn.sm{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 8px;border-bottom:2px solid #e5e8ec;color:#4a5568;font-weight:600;background:#fafbfc}
td{padding:10px 8px;border-bottom:1px solid #f0f2f5}
tr:hover td{background:#fafbfc}
.up{color:#c53030;font-weight:600}
.down{color:#276749;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px}
.tag.buy{background:#fed7d7;color:#9b2c2c}
.tag.sell{background:#c6f6d5;color:#22543d}
.tag.hold{background:#e2e8f0;color:#4a5568}
.tag.ok{background:#c6f6d5;color:#22543d}
.tag.err{background:#fed7d7;color:#9b2c2c}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:10px;padding:24px;width:560px;max-height:85vh;overflow-y:auto}
.modal-box h3{margin-bottom:16px;font-size:16px}
.form-row{margin-bottom:14px}
.form-row label{display:block;margin-bottom:5px;font-size:13px;color:#4a5568}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid #d9dde3;border-radius:5px;font-size:13px;outline:none;font-family:inherit}
.form-row textarea{min-height:110px;font-family:monospace;font-size:12px}
.form-row input:focus{border-color:#2c5282}
.modal-foot{margin-top:18px;text-align:right}
.msg{padding:10px 14px;border-radius:5px;margin-bottom:14px;font-size:13px;display:none}
.msg.ok{background:#f0fff4;color:#22543d;border:1px solid #c6f6d5;display:block}
.msg.err{background:#fff5f5;color:#9b2c2c;border:1px solid #fed7d7;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e0;margin-right:4px;vertical-align:middle}
.live-dot.on{background:#38a169;box-shadow:0 0 0 3px rgba(56,161,105,.18);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-sel{padding:6px 8px;border:1px solid #d9dde3;background:#fff;border-radius:5px;font-size:13px;margin-right:6px;cursor:pointer}
.live-btn{padding:6px 14px;border:1px solid #d9dde3;background:#fff;border-radius:5px;cursor:pointer;font-size:13px}
.live-btn.on{background:#276749;color:#fff;border-color:#276749}
.qr-wrap{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.qr-img{width:200px;height:200px;background:#fff;border:1px solid #e5e8ec;border-radius:8px;padding:6px}
.qr-placeholder{width:200px;height:200px;display:flex;align-items:center;justify-content:center;
  background:#f7f8fa;border:1px dashed #d9dde3;border-radius:8px;color:#b4b2a9;font-size:13px}
.qr-left{margin-top:10px;font-size:12px;color:#8a9099}
.qr-left b{color:#2c5282}
.qr-status{margin-top:14px;text-align:center}
.qr-diag{margin-top:12px;font-size:12px;color:#8a9099}
.qr-diag summary{cursor:pointer;outline:none;user-select:none}
.qr-diag-body{margin-top:8px;padding:10px;background:#f7f8fa;border-radius:6px;
  line-height:1.7;font-family:monospace;font-size:11px;color:#4a5568;
  max-height:150px;overflow:auto}
.qr-diag-raw{color:#8a9099}
.qr-ok{width:100%}
.qr-ok-title{font-size:15px;color:#276749;font-weight:600;text-align:center;margin-bottom:4px}
.qr-ok table{font-size:13px}
.qr-ok th{width:88px;color:#4a5568;background:#fafbfc}
.qr-ok td{padding:9px 8px}
.qr-spin{width:26px;height:26px;border:3px solid #d9dde3;border-top-color:#2c5282;
  border-radius:50%;animation:qrspin .8s linear infinite}
@keyframes qrspin{to{transform:rotate(360deg)}}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.movers h4{font-size:13px;color:#4a5568;margin-bottom:10px;font-weight:600}
.movers table{font-size:12px}
.movers td{padding:7px 6px}
.hint{font-size:12px;color:#8a9099;margin-top:5px;line-height:1.6}
.chart{height:320px;margin-top:10px}
#loading{text-align:center;padding:40px;color:#8a9099}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <h1>三角洲子弹监控</h1>
    <p>管理后台 · 首次登录自动创建管理员</p>
    <input id="u" placeholder="用户名" value="admin">
    <input id="p" type="password" placeholder="密码">
    <button onclick="doLogin()">登 录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="layout" id="app" style="display:none">
  <div class="sidebar">
    <h2>子弹监控后台</h2>
    <a class="active" data-page="dashboard" onclick="go('dashboard')">仪表盘</a>
    <a data-page="credentials" onclick="go('credentials')">凭证管理</a>
    <a data-page="items" onclick="go('items')">子弹管理</a>
    <a data-page="collect" onclick="go('collect')">采集中心</a>
    <a data-page="prices" onclick="go('prices')">价格数据</a>
    <a data-page="signals" onclick="go('signals')">择时信号</a>
    <a data-page="config" onclick="go('config')">系统配置</a>
  </div>
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">仪表盘</h1>
      <div class="right">
        <span id="liveDot" class="live-dot off"></span>
        <select id="liveSec" class="live-sel" onchange="restartAuto()">
          <option value="10">10 秒</option>
          <option value="30" selected>30 秒</option>
          <option value="60">60 秒</option>
          <option value="300">5 分钟</option>
        </select>
        <button id="liveBtn" class="live-btn" onclick="toggleAuto()">开启实时刷新</button>
        <span id="who"></span>
        <button onclick="logout()">退出</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div id="content"><div id="loading">加载中…</div></div>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const API = '';
let TOKEN = localStorage.getItem('df_token') || '';

async function req(path, opt={}){
  opt.headers = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
  if(TOKEN) opt.headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch(API+path, opt);
  if(r.status===401){ logout(); throw new Error('登录已失效'); }
  const j = await r.json();
  if(!r.ok) throw new Error(j.detail || j.msg || '请求失败');
  return j;
}
const get  = p => req(p);
const post = (p,b) => req(p,{method:'POST',body:JSON.stringify(b||{})});
const put  = (p,b) => req(p,{method:'PUT', body:JSON.stringify(b||{})});
const del  = p => req(p,{method:'DELETE'});

function showMsg(text, ok=true){
  const m=document.getElementById('msg');
  m.className='msg '+(ok?'ok':'err'); m.textContent=text;
  setTimeout(()=>{m.className='msg';},4000);
}
function toast(t,ok=true){ showMsg(t,ok); }

async function doLogin(){
  const u=document.getElementById('u').value, p=document.getElementById('p').value;
  document.getElementById('loginErr').textContent='';
  try{
    const r = await fetch('/api/admin/login',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p})});
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail||'登录失败');
    TOKEN=j.token; localStorage.setItem('df_token',TOKEN);
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('who').textContent = j.username;
    go('dashboard');
  }catch(e){ document.getElementById('loginErr').textContent = e.message; }
}
function logout(){
  TOKEN=''; localStorage.removeItem('df_token');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
}

function go(page){
  CURPAGE = page;
  document.querySelectorAll('.sidebar a').forEach(a=>{
    a.classList.toggle('active', a.dataset.page===page);
  });
  const titles={dashboard:'仪表盘',credentials:'凭证管理',items:'子弹管理',
    collect:'采集中心',prices:'价格数据',signals:'择时信号',config:'系统配置'};
  document.getElementById('pageTitle').textContent=titles[page]||page;
  // 自动刷新时静默重绘，避免闪「加载中」
  if(!AUTO_TICK){
    document.getElementById('content').innerHTML='<div id="loading">加载中…</div>';
  }
  ({dashboard,credentials,items,collect,prices,signals,config})[page]();
}

// ---------------- 实时刷新 ----------------
let AUTO=null, AUTO_TICK=false, CURPAGE='dashboard', LAST_REFRESH='-';
function autoPages(){ return ['dashboard','prices','collect']; }
function toggleAuto(){
  if(AUTO){ stopAuto(); }
  else{
    if(autoPages().indexOf(CURPAGE)<0) toast('当前页面不支持自动刷新，请在仪表盘/价格数据/采集中心开启');
    startAuto();
  }
}
function startAuto(){
  stopAuto();
  const sec = parseInt(document.getElementById('liveSec').value,10)||30;
  AUTO = setInterval(()=>{
    AUTO_TICK=true;
    ({dashboard,credentials,items,collect,prices,signals,config})[CURPAGE]()
      .catch(()=>{})
      .finally(()=>{
        AUTO_TICK=false;
        LAST_REFRESH = new Date().toTimeString().slice(0,8);
        const t=document.getElementById('lastRefresh');
        if(t) t.textContent = LAST_REFRESH;
      });
  }, sec*1000);
  const b=document.getElementById('liveBtn');
  b.classList.add('on'); b.textContent='停止实时刷新';
  document.getElementById('liveDot').className='live-dot on';
  LAST_REFRESH = new Date().toTimeString().slice(0,8);
}
function stopAuto(){
  if(AUTO) clearInterval(AUTO);
  AUTO=null;
  const b=document.getElementById('liveBtn');
  if(b){ b.classList.remove('on'); b.textContent='开启实时刷新'; }
  const d=document.getElementById('liveDot');
  if(d) d.className='live-dot off';
}
function restartAuto(){ if(AUTO) startAuto(); }

function modal(html){ document.getElementById('modalBox').innerHTML=html;
  document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',e=>{
  if(e.target.id==='modal') closeModal(); });

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n==null?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0});
const fmtTime = t => t?String(t).slice(0,19):'-';

// ---------------- 仪表盘 ----------------
async function dashboard(){
  let d;
  try{ d = await get('/api/admin/dashboard'); }
  catch(e){ document.getElementById('content').innerHTML='<div class="panel">加载失败: '+e.message+'</div>'; return; }
  const fresh = d.freshness_minutes;
  const freshCls = fresh==null?'':(fresh>180?'danger':(fresh>90?'warn':'ok'));
  const freshTxt = fresh==null?'无数据':(fresh<1?'刚刚':fresh.toFixed(0)+' 分钟前');
  const lc = d.last_collect||{};
  const sch = d.scheduler||{};
  let h = `
  <div class="cards">
    <div class="card ${freshCls}"><div class="label">数据新鲜度</div><div class="value">${freshTxt}</div>
      <div class="sub">最新时段 ${d.latest_hour||'-'}</div></div>
    <div class="card ${d.active_credentials>0?'ok':'danger'}"><div class="label">可用凭证</div>
      <div class="value">${d.active_credentials}</div><div class="sub">凭证池</div></div>
    <div class="card"><div class="label">监控子弹</div><div class="value">${d.watch_items}</div>
      <div class="sub">共 ${d.total_items} 条记录</div></div>
    <div class="card"><div class="label">价格数据</div><div class="value">${fmt(d.total_ticks)}</div>
      <div class="sub">小时级采样点</div></div>
    <div class="card"><div class="label">定时采集</div>
      <div class="value">${sch.running?'运行中':'已停止'}</div>
      <div class="sub">间隔 ${d.scheduler?sch.jobs.length:0} 个任务</div></div>
    <div class="card warn"><div class="label">盈亏平衡涨幅</div>
      <div class="value">${d.breakeven_12h}%</div><div class="sub">策略门槛 ${d.min_gain}%</div></div>
  </div>

  <div class="panel">
    <h3>最近一次采集</h3>
    ${lc.started_at? `<table><tr><th>时间</th><th>状态</th><th>物品数</th><th>成功</th><th>错误</th></tr>
      <tr><td>${fmtTime(lc.started_at)}</td>
      <td><span class="tag ${lc.status==='success'?'ok':(lc.status==='failed'?'err':'hold')}">${lc.status||'-'}</span></td>
      <td>${lc.item_count||0}</td><td>${lc.success_count||0}</td>
      <td>${esc(lc.error_msg||'')}</td></tr></table>` : '<p style="color:#8a9099">还没有采集记录，请先在「凭证管理」添加凭证，再到「采集中心」执行一次采集。</p>'}
  </div>

  <div class="panel">
    <h3>实时行情
      <span class="act">最后刷新 <b id="lastRefresh">${LAST_REFRESH}</b></span></h3>
    <div class="movers">
      <div><h4 style="color:#c53030">▲ 涨幅榜</h4>
        <table><tr><th>名称</th><th>现价</th><th>涨幅</th></tr>
        ${(d.top_gainers||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.price)}</td>
          <td class="up">+${x.change_pct}%<small style="font-weight:400;color:#8a9099;font-size:10px"> (${x.window_hours}h)</small></td></tr>`).join('')||'<tr><td colspan="3" style="color:#8a9099">暂无数据（数据积累中）</td></tr>'}
        </table></div>
      <div><h4 style="color:#276749">▼ 跌幅榜</h4>
        <table><tr><th>名称</th><th>现价</th><th>跌幅</th></tr>
        ${(d.top_losers||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.price)}</td>
          <td class="down">${x.change_pct}%<small style="font-weight:400;color:#8a9099;font-size:10px"> (${x.window_hours}h)</small></td></tr>`).join('')||'<tr><td colspan="3" style="color:#8a9099">暂无数据（数据积累中）</td></tr>'}
        </table></div>
    </div>
    <p class="hint">开启右上角「实时刷新」后，本面板与价格数据、采集中心会按设定间隔自动更新。</p>
  </div>

  <div class="panel">
    <h3>快速开始</h3>
    <ol style="line-height:2;color:#4a5568;padding-left:20px">
      <li>「凭证管理」→ <b>扫码获取凭证</b>（手机 QQ 扫一下，自动配置好）</li>
      <li>「子弹管理」→ 点击「导入弹药种子」→ 再把 propid 替换为抓包得到的官方 11 位 ID</li>
      <li>「采集中心」→ 立即采集，验证能否取到价格</li>
      <li>「采集中心」→ 历史回填 14 天，让择时算法有足够样本</li>
      <li>「择时信号」→ 查看买入机会</li>
    </ol>
  </div>`;
  document.getElementById('content').innerHTML=h;
}

// ---------------- 凭证管理 ----------------
async function credentials(){
  let rows = await get('/api/admin/credentials');
  let h = `<div class="panel"><h3>凭证池
    <span class="act">
      <button class="btn primary" onclick="qrLogin()">扫码获取凭证</button>
      <button class="btn" onclick="credForm()">+ 手动添加</button></span></h3>
    <p class="hint" style="margin-bottom:12px">
      <b style="color:#276749">推荐「扫码获取凭证」</b> —— 点一下出二维码，手机 QQ 扫一下，系统自动抓取并配置好，不用抄任何字符串。<br>
      扫码走腾讯官方登录通道，凭证从腾讯直接进你的数据库，<b>不经过任何第三方平台</b>。<br>
      手动方式：浏览器打开官方周报页 <code>https://df.qq.com/cp/weekly20241129/index.html</code>
      扫码登录后，从地址栏 URL 或 F12 网络请求中抄出 openid / access_token / acctype（QQ 登录填 qc，微信登录填 wx）。</p>
    <table><tr><th>ID</th><th>名称</th><th>openid</th><th>类型</th><th>状态</th>
      <th>成功/失败</th><th>今日用量</th><th>最近成功</th><th>错误</th><th>操作</th></tr>`;
  if(!rows.data.length) h += `<tr><td colspan="10" style="text-align:center;color:#8a9099;padding:24px">暂无凭证</td></tr>`;
  for(const c of rows.data){
    h += `<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.openid_masked||c.openid)}</td>
      <td>${esc(c.acctype)}</td>
      <td><span class="tag ${c.status==='active'?'ok':'hold'}">${c.status}</span></td>
      <td>${c.success_count} / ${c.fail_count}</td>
      <td>${c.used_today} / ${c.daily_quota}</td>
      <td>${fmtTime(c.last_success_at)}</td>
      <td style="color:#c53030;font-size:12px">${esc(c.last_error||'')}</td>
      <td><button class="btn sm" onclick="testCred(${c.id})">测试</button>
        <button class="btn sm" onclick="toggleCred(${c.id})">${c.status==='active'?'停用':'启用'}</button>
        <button class="btn sm" onclick="editCred(${c.id})">编辑</button>
        <button class="btn sm danger" onclick="delCred(${c.id})">删</button></td></tr>`;
  }
  h += `</table></div>`;
  document.getElementById('content').innerHTML=h;
}
function credForm(c){
  c = c||{};

async function saveCred(id){
  const body={name:document.getElementById('f_name').value,
    openid:document.getElementById('f_openid').value,
    acctype:document.getElementById('f_acctype').value,
    appid:document.getElementById('f_appid').value,

    else { body.access_token=t; await post('/api/admin/credentials', body); }
    closeModal(); toast('保存成功'); credentials();

// ---------------- 扫码获取凭证 ----------------
let QR_TIMER=null, QR_SID=null, QR_LEFT=0, QR_TICK=null;

function qrBox(state){
  // state: {status, message, qr, expires_in, result}
  const s = state.status;
  const ok   = s==='success';
  const busy = s==='processing';
  const bad  = s==='failed';
  const dotCls = ok?'ok':(bad?'err':(busy?'ok':'hold'));

  let body;
  if(ok && state.result){
    const R = state.result, V = R.verify||{};
    body = `<div class="qr-ok">
      <div class="qr-ok-title">凭证已保存</div>
      <table style="margin-top:12px">
        <tr><th>名称</th><td>${esc(R.credential_name)}</td></tr>
        <tr><th>openid</th><td>${esc(R.openid_masked)}</td></tr>
        <tr><th>appid</th><td>${esc(R.appid)}</td></tr>
        <tr><th>接口验证</th><td>${V.ok
          ? `<span class="tag ok">通过</span> ${esc(V.propid||'')} @ ${esc((V.stat_hour||'').slice(4)||'')} 价格 <b>${V.price}</b>`
          : `<span class="tag err">未通过</span> <span style="color:#c53030">${esc(V.msg||'')}</span>`}</td></tr>
      </table>
      ${V.ok?'':`<p class="hint" style="margin-top:10px">凭证已入库，但 AMS 接口不认这个 token。
        可在「系统配置 → 扫码登录」里核对 qr_client_id 是否与 AMS 的 appid 一致。</p>`}
    </div>`;
  }else if(state.qr){
    body = `<img class="qr-img" src="data:image/png;base64,${state.qr}" alt="登录二维码">
      <div class="qr-left" id="qrLeft">剩余 <b>${QR_LEFT}</b> 秒</div>`;
  }else{
    body = `<div class="qr-placeholder">${busy?'<div class="qr-spin"></div>':'—'}</div>`;
  }

  return `<h3>扫码获取凭证
      <span class="act"><button class="btn" onclick="qrClose()">${ok?'完成':'取消'}</button></span></h3>
    <p class="hint" style="margin-bottom:14px">请用<b>手机 QQ</b> 扫描下方二维码。
      这是腾讯官方登录码，授权对象是三角洲官方应用，凭证只进你自己的数据库。</p>
    <div class="qr-wrap">${body}</div>
    <div class="qr-status"><span class="tag ${dotCls}">${esc(state.message||'')}</span></div>
    ${(state.log && state.log.length) ? `<details class="qr-diag"><summary>诊断信息</summary>
      <div class="qr-diag-body">${state.log.map(l=>esc(l)).join('<br>')}
      ${state.raw?`<br><span class="qr-diag-raw">原始返回：${esc(state.raw)}</span>`:''}</div></details>`:''}`;
}

async function qrLogin(){
  QR_SID=null; QR_LEFT=0;
  modal(`<div id="qrRoot"><div class="qr-placeholder"><div class="qr-spin"></div></div>
    <p style="text-align:center;color:#8a9099;margin-top:12px">正在向腾讯申请二维码…</p></div>`);
  try{
    const r = await post('/api/admin/credential/qr/start',{});
    QR_SID = r.sid; QR_LEFT = r.expires_in||180;
    document.getElementById('qrRoot').innerHTML = qrBox(r);
    qrStartPolling();
  }catch(e){
    document.getElementById('qrRoot').innerHTML =
      `<h3>扫码获取凭证</h3><p style="color:#c53030;padding:16px 0">申请二维码失败：${esc(e.message)}</p>`;
  }
}

function qrStartPolling(){
  qrStopTimers();
  // 倒计时
  QR_TICK = setInterval(()=>{
    QR_LEFT = Math.max(0, QR_LEFT-1);
    const el = document.getElementById('qrLeft');
    if(el) el.innerHTML = `剩余 <b>${QR_LEFT}</b> 秒`;
  },1000);
  // 状态轮询
  QR_TIMER = setInterval(qrPollOnce, 2000);
}

async function qrPollOnce(){
  if(!QR_SID) return;
  let r;
  try{ r = await get('/api/admin/credential/qr/poll?sid='+QR_SID); }
  catch(e){ qrStopTimers(); return; }

  const st = r.status;
  if(st==='success' || st==='failed'){
    qrStopTimers();
    document.getElementById('qrRoot').innerHTML = qrBox(r);
    if(st==='success'){ toast('凭证已保存并验证'); credentials(); }
    return;
  }
  // 二维码失效时后端会自动换一张，这里只管重画
  if(st==='qrcode' && r.qr){
    QR_LEFT = r.expires_in||180;
    const root = document.getElementById('qrRoot');
    if(root) root.innerHTML = qrBox(r);
  }else{
    const root = document.getElementById('qrRoot');
    if(root) root.innerHTML = qrBox(r);
  }
}

function qrStopTimers(){
  if(QR_TIMER){ clearInterval(QR_TIMER); QR_TIMER=null; }
  if(QR_TICK){ clearInterval(QR_TICK); QR_TICK=null; }
}

async function qrClose(){
  qrStopTimers();
  if(QR_SID){ try{ await post('/api/admin/credential/qr/cancel',{sid:QR_SID}); }catch(e){} }
  QR_SID=null;
  closeModal();
}

  let h = `<div class="panel"><h3>采集控制</h3>
    <p>
      <button class="btn primary" onclick="collectNow()">立即采集一轮</button>
      <button class="btn" onclick="backfill(14)">回填 14 天</button>
      <button class="btn" onclick="backfill(30)">回填 30 天</button>
      <button class="btn" onclick="rebuildBase()">重建日内基准</button>
      <button class="btn" onclick="runSignal()">生成择时信号</button>
    </p>
    <div class="cards" style="margin-top:18px">
      <div class="card ${sch.running?'ok':'hold'}"><div class="label">定时调度</div>
        <div class="value">${sch.running?'运行中':'已停止'}</div>
        <div class="sub">间隔 ${sch.interval} 分钟</div></div>
      <div class="card ${bf.running?'ok':''}"><div class="label">回填任务</div>
        <div class="value">${bf.running?'进行中':'空闲'}</div>
        <div class="sub">${bf.done}/${bf.total}</div></div>
      <div class="card"><div class="label">回填成功</div><div class="value">${bf.success}</div>
        <div class="sub">失败 ${bf.failed}</div></div>
    </div>
    <p style="margin-top:12px">
      <button class="btn" onclick="sched('start')">启动调度</button>
      <button class="btn" onclick="sched('stop')">停止调度</button>
      <button class="btn" onclick="collect()">刷新状态</button>
    </p>
    ${bf.message?`<p class="hint">回填状态：${esc(bf.message)}</p>`:''}
  </div>
  <div class="panel"><h3>采集日志</h3>
    <table><tr><th>开始</th><th>结束</th><th>状态</th><th>物品</th><th>成功</th><th>凭证</th><th>错误</th></tr>`;
  for(const l of logs.data){
    h += `<tr><td>${fmtTime(l.started_at)}</td><td>${fmtTime(l.finished_at)}</td>
      <td><span class="tag ${l.status==='success'?'ok':(l.status==='failed'?'err':'hold')}">${l.status}</span></td>

      <td style="color:#c53030;font-size:12px">${esc(l.error_msg||'')}</td></tr>`;
  }
  h += `</table></div>`;
  document.getElementById('content').innerHTML=h;
}
async function collectNow(){
  try{ const r=await post('/api/admin/collect/now',{});
    toast(r.ok?`采集完成：${r.success}/${r.total}`:('采集失败：'+r.msg), r.ok);
  }catch(e){ toast(e.message,false); } collect();
}
async function backfill(d){
  if(!confirm(`将回填最近 ${d} 天数据，按当前限速约需 ${Math.round(d*24*0.017)} 小时，确定？`))return;
  try{ const r=await post('/api/admin/collect/backfill',{days:d}); toast(r.msg,r.ok); }
  catch(e){ toast(e.message,false); } collect();
}

  const desc = {};
  r.data.forEach(c=>desc[c.config_key]=c.description||'');
  let h = `<div class="panel"><h3>系统配置
    <span class="act"><button class="btn primary" onclick="saveConfig()">保存全部</button></span></h3>
    <p class="hint" style="margin-bottom:14px">所有参数实时生效。修改采集间隔或开关会自动重启调度器。</p>`;
  const tips = {
    '扫码登录':'腾讯若调整登录协议，改这里即可，不用动代码。<b>qr_client_id 必须与上面接口参数的 ams_appid 一致</b>，否则扫码成功但接口不认。'
  };
  for(const [g,keys] of Object.entries(groups)){
    h += `<h3 style="font-size:14px;margin:18px 0 10px;color:#2c5282">${g}</h3>`;
    if(tips[g]) h += `<p class="hint" style="margin:-4px 0 10px">${tips[g]}</p>`;
    h += `<div class="grid2">`;
    for(const k of keys){
      const item = r.data.find(x=>x.config_key===k);
      if(!item) continue;
      h += `<div class="form-row"><label>${k} — ${esc(desc[k]||'')}</label>
        <input data-cfg="${k}" value="${esc(item.config_value)}"></div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  document.getElementById('content').innerHTML=h;
}
async function saveConfig(){
  const body={};
  document.querySelectorAll('[data-cfg]').forEach(i=>{ body[i.dataset.cfg]=i.value; });
  try{ await put('/api/admin/config', body); toast('配置已保存并生效'); }
  catch(e){ toast(e.message,false); }
}

// 启动
if(TOKEN){
  fetch('/api/admin/profile',{headers:{Authorization:'Bearer '+TOKEN}})
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='flex';
      document.getElementById('who').textContent=j.username; go('dashboard'); })
    .catch(()=>{ document.getElementById('login').style.display='flex'; });
}else{
  document.getElementById('login').style.display='flex';
}
</script>
