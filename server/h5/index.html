<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角洲子弹价格监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;font-size:14px}
header{background:#1e3a5f;color:#fff;padding:18px 20px}
header h1{font-size:19px;display:inline-block}
header .nav{float:right;font-size:13px;margin-top:4px}
header .nav a{color:#9fb3c8;text-decoration:none;margin-left:16px}
header .nav a:hover{color:#fff}
header .sub{font-size:12px;color:#9fb3c8;margin-top:6px}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid #e5e8ec;border-radius:8px;padding:14px 16px}
.stat .l{font-size:12px;color:#8a9099}
.stat .v{font-size:21px;font-weight:600;color:#1e3a5f;margin-top:4px}
.stat.warn .v{color:#c05621}
.panel{background:#fff;border:1px solid #e5e8ec;border-radius:8px;padding:16px;margin-bottom:18px}
.panel h2{font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.search{padding:8px 12px;border:1px solid #d9dde3;border-radius:6px;width:260px;font-size:13px;outline:none}
.search:focus{border-color:#2c5282}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 8px;border-bottom:2px solid #e5e8ec;color:#4a5568;background:#fafbfc;cursor:pointer;user-select:none}
th:hover{color:#2c5282}
td{padding:9px 8px;border-bottom:1px solid #f0f2f5}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#f7f9fc}
.up{color:#c53030;font-weight:600}
.down{color:#276749;font-weight:600}
.tag{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px}
.tag.buy{background:#fed7d7;color:#9b2c2c}
.tag.sell{background:#c6f6d5;color:#22543d}
.tag.hold{background:#e2e8f0;color:#4a5568}
.chart{height:300px}
.hint{font-size:12px;color:#8a9099;margin-top:8px;line-height:1.7}
.opp{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ocard{border:1px solid #e5e8ec;border-radius:8px;padding:14px;cursor:pointer}
.ocard:hover{border-color:#2c5282}
.ocard .h{display:flex;justify-content:space-between;align-items:center}
.ocard .n{font-size:14px;font-weight:600}
.ocard .s{font-size:11px;color:#c05621;background:#fffaf0;padding:2px 7px;border-radius:9px}
.ocard .b{margin-top:10px;display:flex;justify-content:space-between;font-size:12px;color:#8a9099}
.ocard .b b{font-size:15px;color:#1f2329;display:block;margin-top:2px}
.ocard .r{font-size:11px;color:#8a9099;margin-top:8px;line-height:1.6}
footer{text-align:center;color:#8a9099;font-size:12px;padding:24px;line-height:1.8}
#mask{display:none}
</style>
</head>
<body>
<header>
  <h1>三角洲子弹价格监控</h1>
  <div class="nav">
    <a href="/admin">管理后台</a>
    <a href="/docs">API 文档</a>
  </div>
  <div class="sub" id="sub">加载中…</div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2>买入机会
      <span style="font-size:12px;color:#8a9099;font-weight:400">
        仅显示预期收益达标的（低于门槛扣完成本无利可图）</span></h2>
    <div class="opp" id="opp"><div class="hint">加载中…</div></div>
  </div>

  <div class="panel">
    <h2>行情
      <input class="search" id="kw" placeholder="搜索子弹名称 / 口径">
    </h2>
    <table>
      <thead><tr>
        <th onclick="sortBy('name')">名称</th>
        <th>口径</th>
        <th onclick="sortBy('price')">当前价</th>
        <th onclick="sortBy('change_pct')">涨跌幅</th>
        <th onclick="sortBy('expected_gain')">预期收益</th>
        <th>信号</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="6" style="text-align:center;padding:30px;color:#8a9099">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="panel" id="cp" style="display:none">
    <h2 id="ct"></h2>
    <div class="chart" id="chart"></div>
    <div class="hint" id="cs"></div>
  </div>
</div>

<footer>
  价格数据以游戏内交易行为准 · 游戏数据版权归腾讯所有<br>
  严禁将哈夫币兑换真实货币（RMT）
</footer>

<script>
const fmt=n=>n==null?'-':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0});
const chg=(v,w)=>{ if(v==null) return '<span style="color:#8a9099">积累中</span>'; const s=v>0?'+':''; return `<span class="${cls(v)}">${s}${v.toFixed(2)}%<small style="font-weight:400;color:#8a9099;font-size:10px"> (${w}h)</small></span>`; };
const cls=v=>v==null?'':(v>0?'up':(v<0?'down':''));
let ALL=[], SORT='score', DESC=true, chartObj=null;

async function api(p){ const r=await fetch(p); return r.json(); }

async function loadStats(){
  const s=await api('/api/stats');
  document.getElementById('sub').textContent =
    `监控 ${s.watch_items} 种子弹 · ${fmt(s.total_ticks)} 个数据点 · 最新时段 ${s.latest_hour||'-'}`;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="l">监控子弹</div><div class="v">${s.watch_items}</div></div>
    <div class="stat"><div class="l">价格数据点</div><div class="v">${fmt(s.total_ticks)}</div></div>
    <div class="stat warn"><div class="l">盈亏平衡涨幅</div><div class="v">${s.breakeven_12h}%</div></div>
    <div class="stat"><div class="l">策略门槛</div><div class="v">${s.min_gain_threshold}%</div></div>
    <div class="stat"><div class="l">可用凭证</div><div class="v">${s.active_credentials}</div></div>`;
}

async function loadList(){
  ALL = (await api('/api/market/list')).data || [];
  ALL.sort((a,b)=>(b.score||0)-(a.score||0));
  render();
}

function render(){
  const kw = document.getElementById('kw').value.trim().toLowerCase();
  let rows = ALL.filter(it => !kw || (it.name+' '+it.caliber+' '+it.grade).toLowerCase().includes(kw));
  rows.sort((a,b)=>{
    const x=a[SORT], y=b[SORT];
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==='string') return DESC? y.localeCompare(x): x.localeCompare(y);
    return DESC? y-x : x-y;
  });
  const tb=document.getElementById('tb');
  if(!rows.length){ tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:#8a9099">没有匹配的物品</td></tr>'; return; }
  tb.innerHTML = rows.map(it=>`<tr class="clickable" onclick="showChart('${it.propid}','${encodeURIComponent(it.name)}')">
    <td>${it.name}</td><td style="color:#8a9099;font-size:12px">${it.caliber||''} ${it.grade||''}</td>
    <td><b>${fmt(it.price)}</b></td>
    <td>${chg(it.change_pct, it.change_window)}</td>
    <td class="${(it.expected_gain||0)>0?'up':''}">${it.expected_gain==null?'-':it.expected_gain+'%'}</td>
    <td><span class="tag ${(it.action||'hold').toLowerCase()}">${it.action||'HOLD'}</span></td></tr>`).join('');
}

function sortBy(k){ if(SORT===k) DESC=!DESC; else {SORT=k; DESC=true;} render(); }

async function loadOpp(){
  const r = await api('/api/signal/opportunities');
  const list=(r.data||[]).filter(x=>x.action!=='HOLD');
  const el=document.getElementById('opp');
  if(!list.length){ el.innerHTML='<div class="hint">当前没有满足门槛的机会。价格数据积累越多，信号越准。</div>'; return; }
  el.innerHTML = list.slice(0,12).map(it=>`<div class="ocard" onclick="showChart('${it.propid}','${encodeURIComponent(it.name)}')">
    <div class="h"><span class="n">${it.name}</span><span class="s">强度 ${it.score}</span></div>
    <div class="b"><span>当前价<b>${fmt(it.price)}</b></span>
      <span>预期收益<b class="up">${it.expected_gain}%</b></span>
      <span>动作<b>${it.action==='BUY'?'买入':'卖出'}</b></span></div>
    <div class="r">${(it.reason||'').slice(0,80)}</div></div>`).join('');
}

async function showChart(pid,name){
  name=decodeURIComponent(name);
  document.getElementById('cp').style.display='block';
  document.getElementById('ct').textContent=name+' · 近 7 天走势';
  const h=(await api('/api/market/'+pid+'/history?hours=168')).data||[];
  const sg=await api('/api/market/'+pid+'/suggest?duration=12');
  if(!chartObj) chartObj=echarts.init(document.getElementById('chart'));
  chartObj.setOption({
    tooltip:{trigger:'axis'},
    grid:{left:66,right:22,top:20,bottom:56},
    xAxis:{type:'category',data:h.map(d=>{
      const s=String(d.stat_hour); return s.slice(4,6)+'-'+s.slice(6,8)+' '+s.slice(8)+'时';}),
      axisLabel:{rotate:45,fontSize:10}},
    yAxis:{type:'value',scale:true,axisLabel:{fontSize:11}},
    series:[{type:'line',data:h.map(d=>d.price),smooth:true,
      lineStyle:{width:2,color:'#2c5282'},
      areaStyle:{color:'rgba(44,82,130,.08)'},itemStyle:{color:'#2c5282'}}]
  },true);
  chartObj.resize();
  if(sg.ok){
    document.getElementById('cs').innerHTML =
      `建议挂单价 <b>${fmt(sg.suggest_price)}</b> · 卖出到手 <b>${fmt(sg.net_proceeds)}</b>` +
      ` · 盈亏平衡需涨 <b style="color:#c05621">${sg.breakeven_gain}%</b>` +
      `（已扣 3% 保证金 + ${sg.duration==12?5:8}% 手续费）`;
  }
  document.getElementById('cp').scrollIntoView({behavior:'smooth',block:'center'});
}

document.getElementById('kw').addEventListener('input', render);
window.addEventListener('resize',()=>chartObj&&chartObj.resize());
(async function(){ await loadStats(); await loadList(); await loadOpp(); })();
</script>
</body>
</html>
